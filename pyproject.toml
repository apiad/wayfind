[project]
name = "repomap"
version = "0.1.0"
description = "A tree-sitter map of a git repository: layout, outlines, callers, impact and numbers, for agents and CI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.22",
    "typer>=0.24.1",
]

[project.scripts]
repomap = "repomap.cli:app"

[project.urls]
Repository = "https://github.com/apiad/repomap"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.9,<0.16",
    "ty==0.0.29",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
